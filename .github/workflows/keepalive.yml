# blitz.cloud —— 免费后台 worker 保活
# 放到仓库的 .github/workflows/keepalive.yml 即可生效，无需任何密钥配置。
#
# 【为什么是「每天」而不是「每 5 天」】
# 平台官方邮件里写着：
#   "your account hasn't been used for 2 days, so we'll stop ..."
#   保持运行的方式：sign in / deploy a change / open the dashboard
# ⇒ 判定窗口只有 2 天。5 天跑一次，中间必然有超过 2 天的空档，会被停。
# 本工作流按「每天 1 次、最大间隔 24 小时」设计，留出一倍余量。
#
# 原理：往 index.html 的 </head> 前覆盖写入一行隐形注释并提交。
#   - index.html 在 Dockerfile 的 COPY 里 ⇒ 必然产生新镜像层 ⇒ 必然触发一次真实部署
#   - index.js（混淆后的常驻后台脚本）从不读取 index.html ⇒ 改动对运行零影响
#   - 先删后插 ⇒ 幂等，反复跑不堆积，每次恒定 +1 行
#
# 注意：提交信息里不要带 [skip ci] / [skip netlify] 之类的标记，
#      否则 Vercel / Render / Netlify 会跳过部署，保活就失效了。

name: keepalive

on:
  schedule:
    # 每天 02:00 与 14:00 UTC（= 北京时间 10:00 与 22:00）。
    # 之所以跑两次：GitHub 的 cron 在高负载时会延迟、偶尔会丢掉一次，
    # 两次里只要有一次成功，间隔就不会超过 2 天。
    - cron: '0 2,14 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略间隔判断，强制提交一次'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 判断是否需要保活提交
        id: gate
        run: |
          set -euo pipefail
          FORCE="${{ github.event.inputs.force || 'false' }}"
          # 只看「最近一次改动 index.html 的时间」——那才是真正触发过部署的那次提交。
          # 若用 git log -1 会误判：只改 .github/ 的提交通常不触发平台部署，
          # 却会把计时器推后，反而造成漏保活。
          LAST=$(git log -1 --format=%ct -- index.html || echo 0)
          LAST=${LAST:-0}
          NOW=$(date +%s)
          AGE_HOURS=$(( (NOW - LAST) / 3600 ))
          echo "距上次改动 index.html：${AGE_HOURS} 小时"
          if [ "$FORCE" = "true" ] || [ "$AGE_HOURS" -ge 20 ]; then
            echo "run=true"  >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "不足 20 小时，本次跳过。"
          fi

      - name: 刷新 index.html 中的时间戳
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, pathlib, datetime

          # newline='' 关闭换行符自动转换：
          # Linux runner 上无影响，但可保证在任何平台上都不会把 LF 改成 CRLF，
          # 否则一次运行就会把整个文件重写，产生几百行的假 diff。
          p = pathlib.Path('index.html')
          with open(p, 'r', encoding='utf-8', newline='') as f:
              src = f.read()

          # 统一用 UTC+8（北京时间）；中国无夏令时，直接偏移即可，不依赖 tzdata
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8)))
          stamp = now.strftime('%Y-%m-%d %H:%M') + ' UTC+8'

          out = src

          # 1) 抹掉历史版本遗留的可见产物：样式块
          out = re.sub(r'\n?[ \t]*/\* keepalive:style \*/[\s\S]*?/\* /keepalive:style \*/', '', out)

          # 2) 抹掉历史版本遗留的可见产物：页面底部时间戳区块
          out = re.sub(r'\n?[ \t]*<!--\s*keepalive:stamp:begin\s*-->[\s\S]*?'
                       r'<!--\s*keepalive:stamp:end\s*-->', '', out)

          # 3) 抹掉所有 keepalive 注释（含历史格式），下面重新写一行
          out = re.sub(r'\n?[ \t]*<!--\s*keepalive:[^>]*?-->', '', out)

          # 4) 只在 </head> 前写入这一行隐形注释（先删后插 ⇒ 幂等）
          line = '  <!-- keepalive: %s -->' % stamp
          if re.search(r'</head>', out, re.I):
              out = re.sub(r'</head>', line + '\n</head>', out, count=1, flags=re.I)
          else:
              out = out.rstrip() + '\n' + line + '\n'

          if out != src:
              with open(p, 'w', encoding='utf-8', newline='') as f:
                  f.write(out)
          print('stamp: ' + stamp)
          PY

      - name: 提交并推送
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name  "keepalive-bot"
          git config user.email "keepalive@users.noreply.github.com"
          if git diff --quiet; then
            echo "无改动，跳过提交。"
            exit 0
          fi
          git add index.html
          git commit -m "chore(keepalive): refresh build stamp - $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') UTC+8"
          git push
          echo "已推送，等待平台重新部署。"
